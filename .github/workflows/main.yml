name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChatGameAI-v0.2-mc1.21.11/ChatGameAI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: chatgameai-jar
          path: ChatGameAI-v0.2-mc1.21.11/ChatGameAI/build/libs/chatgameai-*[0-9].jar
